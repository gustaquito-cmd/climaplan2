name: ClimaPlan CI/CD

# CI runs on changes to main; workflow_dispatch allows manual validation.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep the workflow token read-only.
permissions:
  contents: read

jobs:
  # Backend CI runs tests and packages the application with Java 21.
  backend-ci:
    runs-on: ubuntu-latest
    services:
      # GitHub Actions waits for this PostgreSQL health check before running steps.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: climaplan
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d climaplan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Run backend tests
        working-directory: backend
        # Expose CI secrets only to the test process that needs them.
        env:
          DB_URL: jdbc:postgresql://localhost:5432/climaplan
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: ./mvnw -B test

      - name: Package backend JAR
        working-directory: backend
        run: ./mvnw -B -DskipTests package

  # Frontend CI uses only the npm scripts currently defined in package.json.
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Static analysis/lint is not configured in frontend/package.json.

  # needs gates production deployment on successful backend and frontend CI.
  deploy-backend:
    needs:
      - backend-ci
      - frontend-ci
    # Deploy only a push to main; pull requests and manual runs never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      # Railway uses its configured /backend Root Directory; upload starts at the repository root.
      - name: Deploy backend to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --project d1582111-2a8e-410b-80bb-07a3514101b8 --environment production --service climaplan2 --ci
