spring.application.name=climaplan

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.email.provider=${EMAIL_PROVIDER:none}
app.email.from=${MAIL_FROM:}
app.email.brevo-api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

app.auth.two-factor-enabled=${TWO_FACTOR_ENABLED:false}

openweather.api-key=${OPENWEATHER_API_KEY:}
openweather.geo-base-url=https://api.openweathermap.org/geo/1.0
openweather.weather-base-url=https://api.openweathermap.org/data/2.5

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/climaplan}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs