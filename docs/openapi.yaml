components:
  schemas:
    UsuarioUpdateRequest:
      type: object
      description: Datos editables del usuario
      properties:
        nombre:
          type: string
          description: Nombre completo
          example: Gustavo Pérez
          minLength: 1
        email:
          type: string
          format: email
          description: Correo electrónico
          example: gustavo@example.com
          minLength: 1
      required:
      - email
      - nombre
    UsuarioResponse:
      type: object
      description: Datos públicos del usuario
      properties:
        id:
          type: integer
          format: int64
          description: Identificador
          example: 1
        nombre:
          type: string
          description: Nombre completo
          example: Gustavo Pérez
        email:
          type: string
          description: Correo electrónico
          example: gustavo@example.com
        rol:
          type: string
          description: Rol
          enum:
          - ROLE_USER
          - ROLE_ADMIN
          example: ROLE_USER
        estado:
          type: string
          description: Estado
          enum:
          - ACTIVO
          - INACTIVO
          example: ACTIVO
    ApiErrorResponse:
      type: object
      description: Respuesta estandarizada para errores HTTP
      properties:
        status:
          type: integer
          format: int32
          description: Código de estado HTTP
          example: 0
        error:
          type: string
          description: Descripción breve del error
          example: HTTP error
        message:
          type: string
          description: Mensaje descriptivo del error
          example: Descripción del error
        path:
          type: string
          description: Ruta solicitada
          example: /api/v1/resource
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error
          example: 2026-11-20T12:00:00
        validationErrors:
          type: object
          additionalProperties:
            type: string
          description: Errores de validación por campo
          example:
            campo: mensaje de validación
    PlanRequest:
      type: object
      description: Datos para crear o actualizar un plan
      properties:
        titulo:
          type: string
          description: Título del plan
          example: Senderismo
          minLength: 1
        ciudad:
          type: string
          description: Ciudad de destino
          example: Madrid
          minLength: 1
        fecha:
          type: string
          format: date
          description: Fecha planeada
          example: 2026-12-01
        tipoActividad:
          type: string
          description: Tipo de actividad
          example: Senderismo
          minLength: 1
        notas:
          type: string
          description: Notas adicionales
          example: Llevar protector solar
        estado:
          type: string
          description: Estado del plan
          enum:
          - PENDIENTE
          - COMPLETADO
          - CANCELADO
          example: PENDIENTE
      required:
      - ciudad
      - fecha
      - tipoActividad
      - titulo
    PlanResponse:
      type: object
      description: Plan registrado
      properties:
        id:
          type: integer
          format: int64
          description: Identificador
          example: 1
        titulo:
          type: string
          description: Título
          example: Senderismo
        ciudad:
          type: string
          description: Ciudad
          example: Madrid
        fecha:
          type: string
          format: date
          description: Fecha
          example: 2026-12-01
        tipoActividad:
          type: string
          description: Tipo de actividad
          example: Senderismo
        notas:
          type: string
          description: Notas
          example: Llevar protector solar
        estado:
          type: string
          description: Estado
          enum:
          - PENDIENTE
          - COMPLETADO
          - CANCELADO
          example: PENDIENTE
        usuarioId:
          type: integer
          format: int64
          description: ID del usuario propietario
          example: 1
        nombreUsuario:
          type: string
          description: Nombre del propietario
          example: Gustavo Pérez
    DestinoFavoritoRequest:
      type: object
      description: Datos para crear o actualizar un destino favorito
      properties:
        ciudad:
          type: string
          description: Ciudad del destino
          example: Tuxtla Gutiérrez
          maxLength: 100
          minLength: 0
        pais:
          type: string
          description: País del destino
          example: México
          maxLength: 100
          minLength: 0
        latitud:
          type: number
          format: double
          description: Latitud entre -90 y 90
          example: 16.7538
          maximum: 90.0
          minimum: -90.0
        longitud:
          type: number
          format: double
          description: Longitud entre -180 y 180
          example: -93.116
          maximum: 180.0
          minimum: -180.0
      required:
      - ciudad
      - latitud
      - longitud
      - pais
    DestinoFavoritoResponse:
      type: object
      description: Destino favorito registrado
      properties:
        id:
          type: integer
          format: int64
          description: Identificador
          example: 1
        ciudad:
          type: string
          description: Ciudad
          example: Tuxtla Gutiérrez
        pais:
          type: string
          description: País
          example: México
        latitud:
          type: number
          format: double
          description: Latitud
          example: 16.7538
        longitud:
          type: number
          format: double
          description: Longitud
          example: -93.116
        usuarioId:
          type: integer
          format: int64
          description: Identificador del usuario propietario
          example: 1
    RegisterRequest:
      type: object
      description: Datos requeridos para registrar un usuario
      properties:
        nombre:
          type: string
          description: Nombre completo
          example: Gustavo Pérez
          minLength: 1
        email:
          type: string
          format: email
          description: Correo electrónico
          example: gustavo@example.com
          minLength: 1
        password:
          type: string
          description: Contraseña de al menos 8 caracteres
          example: ClaveSegura123
          maxLength: 2147483647
          minLength: 8
      required:
      - email
      - nombre
      - password
    AuthResponse:
      type: object
      description: Resultado de autenticación con token JWT
      properties:
        accessToken:
          type: string
          description: Token JWT de acceso
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          description: Tipo de token
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Duración del token en milisegundos
          example: 3600000
        usuario:
          $ref: "#/components/schemas/UsuarioResponse"
          description: Datos del usuario autenticado
    LoginRequest:
      type: object
      description: Credenciales para iniciar sesión
      properties:
        email:
          type: string
          format: email
          description: Correo registrado
          example: gustavo@example.com
          minLength: 1
        password:
          type: string
          description: Contraseña del usuario
          example: ClaveSegura123
          minLength: 1
      required:
      - email
      - password
    WeatherResponse:
      type: object
      description: Información meteorológica actual
      properties:
        ciudad:
          type: string
          description: Ciudad
          example: Madrid
        pais:
          type: string
          description: Código de país
          example: ES
        lat:
          type: number
          format: double
          description: Latitud
          example: 40.4165
        lon:
          type: number
          format: double
          description: Longitud
          example: -3.70256
        temperatura:
          type: number
          format: double
          description: Temperatura en grados Celsius
          example: 21.5
        sensacionTermica:
          type: number
          format: double
          description: Sensación térmica
          example: 20.8
        humedad:
          type: integer
          format: int32
          description: Humedad porcentual
          example: 45
        descripcion:
          type: string
          description: Descripción meteorológica
          example: cielo despejado
        velocidadViento:
          type: number
          format: double
          description: Velocidad del viento
          example: 3.2
    PlanWeatherCheckResponse:
      type: object
      description: Evaluación meteorológica asociada a un plan
      properties:
        planId:
          type: integer
          format: int64
          description: ID del plan
          example: 1
        titulo:
          type: string
          description: Título del plan
          example: Senderismo
        ciudad:
          type: string
          description: Ciudad
          example: Madrid
        fecha:
          type: string
          format: date
          description: Fecha
          example: 2026-12-01
        estadoClimatico:
          type: string
          description: Estado climático
          enum:
          - FAVORABLE
          - PRECAUCION
          - NO_RECOMENDABLE
        clima:
          $ref: "#/components/schemas/WeatherResponse"
          description: Datos meteorológicos
        recomendacion:
          type: string
          description: Recomendación
          example: Las condiciones son favorables
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
